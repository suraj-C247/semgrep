name: Semgrep Scan on PR

on:
  pull_request:  # Runs Semgrep when a PR is created
  push:  # Runs Semgrep on push (optional)

permissions:  # Explicitly grant permission to write PR comments
  contents: read
  pull-requests: write
  security-events: write  # Add this if you want to enable SARIF upload

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep - All Security Rules
        id: semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: |-
            p/security-audit
            p/phpcs-security-audit
            p/php 
            p/php-laravel
            p/sql-injection
            p/secrets
            p/xss
            p/javascript
            auto
          generateSarif: true  # This will generate a SARIF report
          output: semgrep.json  # Explicitly set the JSON output file
        continue-on-error: true  # This ensures the workflow continues even if Semgrep finds issues

      - name: Verify Report Generation
        run: |
          if [ -f "semgrep.json" ]; then
            echo "Semgrep report was generated successfully"
            echo "report_exists=true" >> $GITHUB_ENV
          else
            echo "Semgrep report was not generated"
            echo "report_exists=false" >> $GITHUB_ENV
          fi

      - name: Upload Semgrep Report
        if: env.report_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.json
          retention-days: 5  # Keep the artifact for 5 days

      - name: Upload SARIF file
        if: env.report_exists == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

      - name: Post Semgrep Findings as PR Comments
        if: github.event_name == 'pull_request'
        uses: mshick/add-pr-comment@v2
        with:
          message: |
            🔍 **Semgrep Security Scan Report** 🔍
            - This PR was automatically scanned using **Semgrep** for security issues.
            - Findings are available in the **Semgrep Report** artifact.
            - If vulnerabilities were detected, please review and fix them before merging.
          repo-token: ${{ secrets.GITHUB_TOKEN }}
