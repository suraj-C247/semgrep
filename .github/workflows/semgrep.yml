name: Semgrep Scan on PR

on:
  pull_request:  # Runs Semgrep when a PR is created
  push:  # Runs Semgrep on push (optional)

permissions:  # Explicitly grant permission to write PR comments
  contents: read
  pull-requests: write

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep - All Security Rules
        uses: returntocorp/semgrep-action@v1
        with:
          config: |
            p/security-audit
            p/phpcs-security-audit
            p/php 
            p/php-laravel
            p/sql-injection
            p/secrets
            p/xss
            p/javascript
          generateSarif: true

      - name: Upload Semgrep Report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif

      - name: Post Semgrep Findings as PR Comments
        if: github.event_name == 'pull_request'
        uses: mshick/add-pr-comment@v2
        with:
          message: |
            🔍 **Semgrep Security Scan Report** 🔍
            - This PR was automatically scanned using **Semgrep** for security issues.
            - Findings are available in the **Semgrep Report** artifact.
            - If vulnerabilities were detected, please review and fix them before merging.
          repo-token: ${{ secrets.GITHUB_TOKEN }}
